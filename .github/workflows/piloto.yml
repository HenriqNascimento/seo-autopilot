name: Piloto SEO

on:
  schedule:
    - cron: "0 6 * * *"   # cada día 07:00/08:00 (España): cada sitio publica según su sitio.json; domingo, aprendizaje
  workflow_dispatch:
    inputs:
      comando:
        description: "verificar | borrador | exportar | diario | configurar | investigar | publicar | semanal | estado"
        default: diario
      sitio:
        description: "id del sitio (innovadental, cresco…) para comandos manuales"
        default: ""

permissions:
  contents: write

concurrency: piloto

jobs:
  piloto:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GSC_CREDENCIALES: ${{ secrets.GSC_CREDENCIALES }}
      HUBSPOT_TOKEN_INNOVADENTAL: ${{ secrets.HUBSPOT_TOKEN_INNOVADENTAL }}
      PAUSADO: ${{ vars.PAUSADO }}
      PRESUPUESTO_USD_MES: ${{ vars.PRESUPUESTO_USD_MES || '9' }}
      # Cresco (web estática en Cloudflare): repo de la web + registro de contactos en Workers KV
      TIENE_WEB_CRESCO: ${{ secrets.CRESCO_WEB_TOKEN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      CF_KV_LEADS_ID: ${{ vars.CF_KV_LEADS_ID }}
      PILOTO_GIT_PUSH: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Repo de la web de Cresco
        if: env.TIENE_WEB_CRESCO == 'true'
        uses: actions/checkout@v4
        with:
          repository: HenriqNascimento/cresco-web
          token: ${{ secrets.CRESCO_WEB_TOKEN }}
          path: _webs/cresco-web
      - name: Rutas de las webs
        if: env.TIENE_WEB_CRESCO == 'true'
        run: echo "CRESCO_WEB_DIR=$GITHUB_WORKSPACE/_webs/cresco-web" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ejecutar
        run: |
          CMD="${{ inputs.comando || 'diario' }}"
          if [ -n "${{ inputs.sitio }}" ]; then python -m piloto "$CMD" --sitio "${{ inputs.sitio }}"; else python -m piloto "$CMD"; fi
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "piloto-seo"
          git config user.email "piloto-seo@users.noreply.github.com"
          git add sitios/*/estado estado_global
          git diff --cached --quiet || git commit -m "estado: $(date +%F)"
          git push
